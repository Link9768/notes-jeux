<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Notes Jeux</title>
<style>
:root{--bg:#121214;--card:#1c1c20;--line:#2c2c32;--txt:#ececf1;--mut:#8b8b96;--acc:#4f8cff;--ej:#e3342f;--ph:#f08c00;--ml:#9b59d0;--okk:#ff8a00;--ok:#34c759}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
a{color:var(--acc)}
.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.head img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--card)}
.head h1{font-size:20px;margin:0}
.mut{color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.src{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.big{font-size:26px;font-weight:700;margin-top:4px}
.big small{font-size:13px;color:var(--mut);font-weight:400}
.match{font-size:11px;color:var(--mut);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na{color:var(--mut);font-style:italic;margin-top:6px}
.ml{border:2px solid var(--ml);border-radius:12px;overflow:hidden;margin-top:10px}
.ml header{background:var(--ml);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ml .body{padding:12px;display:grid;gap:12px}
.ml .facts{display:flex;flex-wrap:wrap;gap:6px 16px}
.ml h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:14px;background:var(--line)}
.chip.th{background:transparent;border:1px solid var(--line);color:var(--mut)}
.sim{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.sim:first-of-type{border-top:0}
.go{padding:2px 8px;margin-left:6px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mut);font-size:13px;line-height:1.4;cursor:pointer}
.go:hover{color:var(--txt);border-color:var(--ml)}
.liens{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;align-items:center}
.bga{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px;text-decoration:none;vertical-align:1px}
.bga.oui{background:#34c75933;color:var(--ok)}
.bga.oui:hover{background:#34c75966}
.bga.non{background:var(--line);color:var(--mut)}
.ml footer{padding:10px;text-align:center;border-top:1px solid var(--line)}
.okk{border:2px solid var(--okk);border-radius:12px;overflow:hidden;align-self:start}
.okk header{background:var(--okk);color:#fff;padding:10px 12px}
.okk header b{font-size:15px}
.ann{display:grid;grid-template-columns:60px 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.tag{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--line);color:var(--mut);margin-left:4px}
.tag.ok{background:#34c75933;color:var(--ok)}
.okk footer{padding:10px;text-align:center}
.okk footer a{color:var(--okk);font-weight:700}
.skel{height:14px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--line),#3a3a42,var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:760px){.layout{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.tile{padding:8px}.big{font-size:20px}.head img{width:44px;height:44px}.ann{grid-template-columns:52px 1fr auto}}
</style>
</head>
<body>
<main>
  <form id="f"><input id="q" aria-label="Nom du jeu" placeholder="Nom du jeu (ex. Clank)" autocomplete="off" enterkeyhint="search"><button>Rechercher</button></form>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const API = 'https://n8n.srv1250642.hstgr.cloud/webhook/notes-jeux';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fr = n => String(n).replace('.', ',');
// Année affichée quand ce n'est pas l'année en cours (sinon une annonce ancienne paraît récente).
const fmtDate = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return y === String(new Date().getFullYear()) ? `${d}/${m}` : `${d}/${m}/${y}`;
};
const ext = (url, txt) => `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`;
let seq = 0;

function tile(name, color, d, scale, unit, searchUrl) {
  const src = `<div class="src"><span class="dot" style="background:${color}"></span>${name}</div>`;
  if (!d) return `<div class="tile">${src}<div class="na">indisponible</div><div class="match">${ext(searchUrl, 'chercher ↗')}</div></div>`;
  const val = d.note == null
    ? `<div class="na">pas encore d'avis</div>`
    : `<div class="big">${fr(d.note)}<small>/${scale}</small></div><div class="mut">${d.avis ?? d.votes ?? '?'} ${unit}</div>`;
  return `<div class="tile">${src}${val}<div class="match">« ${esc(d.titre)} » ${ext(d.url, '↗')}</div></div>`;
}

// Grand encart MyLudo : note de la communauté, infos pratiques, style de jeu (mécaniques) et jeux semblables.
function myludo(m, lien) {
  if (!m) return `<section class="ml"><header><b>MyLudo</b><span>indisponible</span></header><footer>${ext(lien, 'Chercher sur MyLudo ↗')}</footer></section>`;
  const note = m.note == null ? `<span class="na">pas encore d'avis</span>` : `<span class="big">${fr(m.note)}<small>/10</small></span> <span class="mut">${m.avis} notes</span>`;
  const facts = [m.duree && `⏱ ${esc(m.duree)} min`, m.joueurs && `👥 ${esc(m.joueurs)}`, m.complexite != null && `⚖ ${fr(m.complexite)}/5`].filter(Boolean).map(f => `<span>${f}</span>`).join('');
  const style = m.mecaniques === null || m.mecaniques === undefined
    ? '<div class="na">indisponible</div>'
    : `<div class="chips">${m.mecaniques.map(x => `<span class="chip">${esc(x)}</span>`).join('')}${(m.themes || []).map(x => `<span class="chip th">${esc(x)}</span>`).join('')}</div>`;
  const ligne = s => `<div class="sim"><span>${ext(s.url, esc(s.titre))} <span class="mut">${s.annee ?? ''}</span><button type="button" class="go" data-q="${esc(s.titre)}" title="Chercher ${esc(s.titre)}" aria-label="Chercher ${esc(s.titre)}">🔍</button></span><span>${s.note != null ? `<b>${fr(s.note)}</b><span class="mut">/10</span>` : ''}</span></div>`;
  const sims = (m.similaires || []).map(ligne).join('');
  const jeuxAuteur = m.memeAuteur && m.memeAuteur.jeux ? m.memeAuteur.jeux.map(ligne).join('') : '';
  return `<section class="ml"><header><b>MyLudo</b><span>${m.annee ? esc(m.annee) : ''}</span></header><div class="body"><div>${note}</div><div class="facts">${facts}</div><div><h3>Style de jeu</h3>${style}</div>${sims ? `<div><h3>Semblable à</h3>${sims}</div>` : ''}${jeuxAuteur ? `<div><h3>Du même auteur · ${esc(m.memeAuteur.nom)}</h3>${jeuxAuteur}</div>` : ''}</div><footer>${ext(m.url, 'Ouvrir sur MyLudo ↗')}</footer></section>`;
}

// Board Game Arena : liste des jeux publics (lib/bga-games.json, régénérée par scripts/build-bga-list.mjs) chargée avec la page.
// Entrée : [slug, titre anglais, bggId (0 si inconnu), ...alias]. null tant qu'elle n'est pas lue (ou si elle est injoignable).
const BGA = fetch('lib/bga-games.json').then(r => (r.ok ? r.json() : null)).catch(() => null);
const COMBINING = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
const norm = s => String(s || '').normalize('NFD').replace(COMBINING, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
// Vrai si a et b sont égaux à une insertion, suppression ou substitution près.
function within1(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1);
  return a.length > b.length ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
}
// Correspondance exacte, sinon à une lettre près (« catane » → CATAN). Pas de correspondance « contient » (« Dune » ≠ « Dune: Imperium »).
// Alias de moins de 5 lettres (« TTR ») ignorés : trop ambigus.
function findBga(titres, games) {
  const keys = [...new Set((titres || []).map(norm).filter(Boolean))];
  if (!keys.length || !games) return null;
  const noms = g => [g[1], ...g.slice(3).filter(a => norm(a).length >= 5)].map(norm);
  const pick = test => {
    for (const k of keys) { const g = games.find(x => noms(x).some(n => test(n, k))); if (g) return g; }
    return null;
  };
  const g = pick((n, k) => n === k) || pick((n, k) => k.length >= 5 && within1(n, k));
  return g ? { nom: g[1], url: 'https://boardgamearena.com/gamepanel?game=' + g[0], bggId: g[2] || null } : null;
}

// Pastille Board Game Arena, à côté du nombre de joueurs : « BGA ✓ » cliquable (page du jeu sur BGA) ou « BGA ✓ » barré si le jeu n'y est pas.
// Rien tant que la liste BGA n'est pas lue (ou injoignable).
function bgaBadge(d, games) {
  if (!games) return '';
  const bga = findBga([d.query, d.myludo && d.myludo.titre], games);
  return bga
    ? `<a class="bga oui" href="${esc(bga.url)}" target="_blank" rel="noopener" title="Jouable sur Board Game Arena : ouvrir la page du jeu">BGA ✓</a>`
    : '<span class="bga non" title="Pas sur Board Game Arena">BGA <s>✓</s></span>';
}

// Sous les encarts : page BoardGameGeek du jeu (lien direct si connu, repli par l'identifiant BGA, sinon recherche).
function liens(d, games) {
  const bga = findBga([d.query, d.myludo && d.myludo.titre], games);
  const bggUrl = d.bggUrl || (bga && bga.bggId ? 'https://boardgamegeek.com/boardgame/' + bga.bggId : null);
  return `<div class="liens">${bggUrl ? ext(bggUrl, 'BoardGameGeek ↗') : ext(d.liens.bgg, 'Chercher sur BoardGameGeek ↗')}</div>`;
}

function okk(o, lien) {
  if (!o) return `<section class="okk"><header><b>Okkazeo</b><div>indisponible</div></header><footer>${ext(lien, 'Chercher sur Okkazeo ↗')}</footer></section>`;
  const rows = o.annonces.map(a => `<div class="ann"><b>${fr(a.prix)} €</b><span>${esc(a.etat)}${a.bonneAffaire ? '<span class="tag ok">bonne affaire</span>' : ''}${a.extensions ? '<span class="tag">+ ext.</span>' : ''}<br><span class="mut">${esc(a.ville ?? '')}</span></span><span class="mut">${fmtDate(a.date)}</span></div>`).join('');
  const prix = o.total && o.min != null ? ` · ${fr(o.min)}–${fr(o.max)} €` : '';
  const pied = o.annonces.length ? 'Ouvrir sur Okkazeo ↗' : o.total ? `Voir les ${o.total} annonces France ↗` : 'Ouvrir sur Okkazeo ↗';
  return `<section class="okk"><header><b>Okkazeo · ${o.annonces.length} près de Paris</b><div>${o.total} en France${prix}</div></header>${rows}<footer>${ext(o.url, pied)}</footer></section>`;
}

function render(d, games) {
  const m = d.myludo, L = d.liens;
  const head = m
    ? `<div class="head">${m.image ? `<img src="${esc(m.image)}" alt="">` : ''}<div><h1>${esc(m.titre)}</h1><div class="mut">${[m.annee, m.joueurs && m.joueurs + ' joueurs', m.age].filter(Boolean).map(esc).join(' · ')}${bgaBadge(d, games)}</div></div></div>`
    : `<div class="head"><div><h1>${esc(d.query)}</h1><div class="mut">${bgaBadge(d, games)}</div></div></div>`;
  const tiles = `<div class="tiles">${tile('Esprit Jeu', 'var(--ej)', d.espritjeu, 5, 'avis', L.espritjeu)}${tile('Philibert', 'var(--ph)', d.philibert, 5, 'avis', L.philibert)}</div>`;
  $('#out').innerHTML = `<div class="layout"><div>${head}${tiles}${myludo(m, L.myludo || '#')}${liens(d, games)}</div>${okk(d.okkazeo, L.okkazeo)}</div>`;
}

function skeleton() {
  const t = n => `<div class="tile"><div class="src">${n}</div><div class="skel" style="width:50%;height:22px"></div><div class="skel" style="width:70%"></div></div>`;
  return `<div class="layout"><div><div class="tiles">${t('Esprit Jeu')}${t('Philibert')}</div><section class="ml"><header><b>MyLudo</b></header><div class="body"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section></div><section class="okk"><header><b>Okkazeo</b></header><div style="padding:12px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section></div>`;
}

async function search(q) {
  const my = ++seq;
  $('#out').innerHTML = skeleton();
  try {
    const r = await fetch(API + '?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const games = await BGA;
    if (my === seq) render(d, games);
  } catch (err) {
    if (my === seq) $('#out').innerHTML = `<p class="na">Recherche impossible (${esc(err.message)}). Réessaie dans un instant.</p>`;
  }
}

function lancer(q) {
  if (!q) return;
  $('#q').value = q;
  history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  search(q);
}

$('#f').addEventListener('submit', e => {
  e.preventDefault();
  lancer($('#q').value.trim());
});

// Raccourci 🔍 à côté d'un jeu semblable : lance la recherche de ce jeu sans retaper son nom.
$('#out').addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.go');
  if (b) { lancer(b.dataset.q); scrollTo(0, 0); }
});

const initial = new URLSearchParams(location.search).get('q');
if (initial) { $('#q').value = initial; search(initial.trim()); }
</script>
</body>
</html>
