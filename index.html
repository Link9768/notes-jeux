<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Notes Jeux</title>
<style>
:root{--bg:#121214;--card:#1c1c20;--line:#2c2c32;--txt:#ececf1;--mut:#8b8b96;--acc:#4f8cff;--ej:#e3342f;--ph:#f08c00;--bgg:#1f6fb2;--ml:#9b59d0;--okk:#ff8a00;--ok:#34c759}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
a{color:var(--acc)}
.head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.head img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--card)}
.head h1{font-size:20px;margin:0}
.mut{color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.src{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.big{font-size:26px;font-weight:700;margin-top:4px}
.big small{font-size:13px;color:var(--mut);font-weight:400}
.match{font-size:11px;color:var(--mut);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na{color:var(--mut);font-style:italic;margin-top:6px}
.ml{border:2px solid var(--ml);border-radius:12px;overflow:hidden;margin-top:10px}
.ml header{background:var(--ml);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ml .body{padding:12px;display:grid;gap:12px}
.ml .facts{display:flex;flex-wrap:wrap;gap:6px 16px}
.ml h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:14px;background:var(--line)}
.chip.th{background:transparent;border:1px solid var(--line);color:var(--mut)}
.sim{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.sim:first-of-type{border-top:0}
.go{padding:2px 8px;margin-left:6px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mut);font-size:13px;line-height:1.4;cursor:pointer}
.go:hover{color:var(--txt);border-color:var(--ml)}
.onglets{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.onglet{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--txt);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.onglet.on{background:var(--acc);border-color:var(--acc);color:#fff}
.onglet.att{color:var(--mut)}
.back{display:inline-flex;gap:6px;align-items:center;margin-bottom:12px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-size:14px;font-weight:600;cursor:pointer}
.back:hover{border-color:var(--acc)}
.aut{margin-top:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.aut h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 6px;font-weight:600}
.autjeux{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 24px}
.aut .sim{border-top:0;border-bottom:1px solid var(--line)}
.bga{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px;text-decoration:none;vertical-align:1px}
.bga.oui{background:#34c75933;color:var(--ok)}
.bga.oui:hover{background:#34c75966}
.bga.non{background:var(--line);color:var(--mut)}
.ml footer{padding:10px;text-align:center;border-top:1px solid var(--line)}
.ml.bgg{border-color:var(--bgg)}
.ml.bgg header{background:var(--bgg)}
button.chip{border:0;color:var(--txt);font:inherit;font-size:12px;cursor:pointer}
button.chip:hover,button.chip.on{background:var(--bgg);color:#fff}
.bga.ext{border:0;font-family:inherit;cursor:pointer}
.box{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.box:empty{display:none}
.box h4{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:600}
.raison{font-size:11px;color:var(--mut);padding:0 0 6px}
.depli{width:100%;text-align:left;background:transparent;color:var(--txt);border:0;padding:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;cursor:pointer}
.depli:hover{color:var(--acc)}
.onglet-g{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}
.onglet-g.on{background:var(--acc);border-color:var(--acc)}
.onglet-g .onglet{border:0;background:transparent;padding-right:4px}
.onglet-g.on .onglet{color:#fff}
.onglet-g .x{border:0;background:transparent;color:var(--mut);padding:4px 10px 4px 2px;font-size:12px;cursor:pointer}
.onglet-g.on .x{color:#fff}
.outils-r{display:flex;gap:8px;margin:-8px 0 14px;min-height:0}
.petit{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--txt);font-size:12px;font-weight:600}
.cam{padding:0 12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.deal{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;font-weight:700}
.deal.top{background:#34c75933;color:var(--ok)}
.deal.moy{background:#ff9f0a33;color:#ff9f0a}
.deal.bof{background:var(--line);color:var(--mut)}
.comp{width:100%;border-collapse:collapse;font-size:13px}
.compwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.comp th,.comp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.comp th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.comp td.best{color:var(--ok);font-weight:700}
.lien{background:none;border:0;padding:0;color:var(--acc);font:inherit;font-size:inherit;font-weight:400;cursor:pointer;text-align:left}
.bga.plus{border:0;font-family:inherit;cursor:pointer;background:var(--line);color:var(--txt);margin-left:3px}
.bga.plus.on{background:#34c75933;color:var(--ok)}
.addl{margin-top:6px}
.addl summary{cursor:pointer;font-size:12px;color:var(--mut);display:inline-block}
.addl .chips{margin-top:6px}
.nvlw{display:flex;gap:6px;margin-top:8px}
.nvlw input{padding:6px 10px;font-size:14px;flex:0 1 220px}
.sim .x{border:0;background:transparent;color:var(--mut);padding:0 4px;font-size:13px;cursor:pointer}
.actl{display:flex;gap:8px;margin-top:8px}
.actl:empty{display:none}
.titre-l{font-size:18px;margin:0 0 4px}
.okk{border:2px solid var(--okk);border-radius:12px;overflow:hidden;margin-top:14px}
.okk header{background:var(--okk);color:#fff;padding:10px 12px}
.okk header b{font-size:15px}
.ann{display:grid;grid-template-columns:minmax(60px,auto) 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.tag{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--line);color:var(--mut);margin-left:4px}
.tag.ok{background:#34c75933;color:var(--ok)}
.okk footer{padding:10px;text-align:center}
.okk footer a{color:var(--okk);font-weight:700}
.panier{border:2px solid var(--okk);border-radius:12px;overflow:hidden;margin-top:14px}
.panier header{background:var(--okk);color:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.panier header b{font-size:15px}
.panier form{display:flex;gap:8px;padding:12px;margin:0;align-items:flex-start}
.panier textarea{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;font-size:15px;resize:vertical}
.panier button{background:var(--okk)}
#pr{padding:0 12px 12px;display:grid;gap:10px}
.vend{border:1px solid var(--line);border-radius:10px;padding:10px}
.vend .top{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-bottom:4px}
.vend .top .right{margin-left:auto}
.ann2{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.skel{height:14px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--line),#3a3a42,var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:760px){.panier form{flex-direction:column;align-items:stretch}.tiles{grid-template-columns:repeat(2,1fr)}.tile{padding:8px}.big{font-size:20px}.head img{width:44px;height:44px}.ann{grid-template-columns:minmax(52px,auto) 1fr auto}}
</style>
</head>
<body>
<main>
  <form id="f"><input id="q" list="sugg" aria-label="Nom du jeu" placeholder="Un jeu, ou plusieurs séparés par des virgules (ou une liste collée)" autocomplete="off" enterkeyhint="search"><datalist id="sugg"></datalist><button type="button" class="cam" id="camb" title="Scanner un code-barres" aria-label="Scanner un code-barres">📷</button><input type="file" id="cam" accept="image/*" capture="environment" hidden><button>Rechercher</button></form>
  <div class="outils-r" id="vers"></div>
  <div id="out" aria-live="polite"></div>
  <section class="panier">
    <header><b>Matchmaking Okkazeo</b><span>vendeurs qui ont plusieurs jeux de ta liste</span></header>
    <form id="pf"><textarea id="pj" rows="4" aria-label="Jeux recherchés, un par ligne" placeholder="Un jeu par ligne (2 à 15)&#10;7 Wonders Duel&#10;Carcassonne&#10;Azul"></textarea><button>Chercher les vendeurs</button></form>
    <div id="pr" aria-live="polite"></div>
  </section>
</main>
<script>
const API = 'https://n8n.srv1250642.hstgr.cloud/webhook/notes-jeux';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fr = n => String(n).replace('.', ',');
// Année affichée quand ce n'est pas l'année en cours (sinon une annonce ancienne paraît récente).
const fmtDate = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return y === String(new Date().getFullYear()) ? `${d}/${m}` : `${d}/${m}/${y}`;
};
// Liens externes ouverts dans le même onglet (target="_blank" déclenchait « pop-up bloqué » sur mobile) ; le retour du navigateur ramène ici.
const ext = (url, txt) => `<a href="${esc(url)}" rel="noopener">${txt}</a>`;
let seq = 0;

function tile(name, color, d, scale, unit, searchUrl) {
  const src = `<div class="src"><span class="dot" style="background:${color}"></span>${name}</div>`;
  if (!d) return `<div class="tile">${src}<div class="na">indisponible</div><div class="match">${ext(searchUrl, 'chercher ↗')}</div></div>`;
  const val = d.note == null
    ? `<div class="na">pas encore d'avis</div>`
    : `<div class="big">${fr(d.note)}<small>/${scale}</small></div><div class="mut">${d.avis ?? d.votes ?? '?'} ${unit}</div>`;
  // Prix neuf (boutiques) ; durée et poids (⚖ = complexité sur 5) si la source les donne.
  const infos = [d.prix != null && `${fr(d.prix)} € neuf`, d.duree && `⏱ ${esc(d.duree)} min`, d.poids != null && `⚖ ${fr(d.poids)}/5`].filter(Boolean);
  const plus = infos.length ? `<div class="mut" style="margin-top:4px">${infos.join(' · ')}</div>` : '';
  return `<div class="tile">${src}${val}${plus}<div class="match">« ${esc(d.titre)} » ${ext(d.url, '↗')}</div></div>`;
}

// Une ligne de jeu (semblable ou du même auteur) : lien vers sa fiche, année, bouton 🔍 qui lance sa recherche, note si connue.
// interne: true → le titre ouvre le jeu dans l'appli (comme 🔍), pas sa page BGG (extensions).
function ligneJeu(s) {
  const go = s.interne ? '' : `<button type="button" class="go" data-q="${esc(s.titre)}" title="Chercher ${esc(s.titre)}" aria-label="Chercher ${esc(s.titre)}">🔍</button>`;
  const titre = s.interne ? `<button type="button" class="lien" data-q="${esc(s.titre)}">${esc(s.titre)}</button>` : ext(s.url, esc(s.titre));
  return `<div class="sim"><span>${titre} <span class="mut">${s.annee ?? ''}</span>${go}</span><span>${s.note != null ? `<b>${fr(s.note)}</b><span class="mut">/10</span>` : ''}</span></div>`;
}

// Encart « Semblable à » : recommandations des joueurs BGG (note BGG sur 10).
function semblables(d) {
  const s = d && d.similaires;
  if (!s || !s.length) return '';
  return `<section class="aut"><h3>Semblable à · recommandations BGG</h3><div class="autjeux">${s.map(ligneJeu).join('')}</div></section>`;
}

// Encart dépliable « Jumeaux » : 1 ou 2 jeux quasi identiques (calcul du workflow Outils, au clic).
function jumeauxBloc(d) {
  const id = d && d.bgg && d.bgg.id;
  return id ? `<section class="aut"><button type="button" class="depli" data-jum="${esc(id)}" aria-expanded="false">🎯 Jumeaux · les jeux les plus proches ▸</button><div class="box" id="jumbox"></div></section>` : '';
}

// Outils chargés au clic (workflow « Notes Jeux — Outils ») : réponses gardées le temps de la page.
const API_OUTILS = 'https://n8n.srv1250642.hstgr.cloud/webhook/notes-jeux-outils';
const OUTILS = new Map();
function outil(params) {
  const url = API_OUTILS + '?' + Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  if (!OUTILS.has(url)) {
    OUTILS.set(url, fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(j => { if (j.erreur) throw new Error(j.erreur); return j; })
      .catch(e => { OUTILS.delete(url); throw e; }));
  }
  return OUTILS.get(url);
}
const chargeBox = '<div class="skel"></div><div class="skel" style="width:70%"></div>';
const listeBox = (titre, jeux, vide) => (jeux.length ? `<h4>${titre}</h4>${jeux.map(ligneJeu).join('')}` : `<p class="na">${vide}</p>`);
function jumeauxHtml(j) {
  if (!j.length) return '<p class="na">Aucun jeu assez proche trouvé.</p>';
  return j.map(x => `${ligneJeu(x)}<div class="raison">En commun : ${x.raison.map(esc).join(', ')}</div>`).join('');
}
function extensionsHtml(e) {
  return listeBox(`${e.length} extension${e.length > 1 ? 's' : ''} · note BGG`, e.map(x => ({ ...x, interne: true })), 'Aucune extension notée.');
}
// Dépliable : 1er clic charge et ouvre, clic suivant referme.
async function deplier(bouton, boite, charge, html) {
  const ouvert = bouton.getAttribute('aria-expanded') === 'true';
  bouton.setAttribute('aria-expanded', String(!ouvert));
  if (bouton.textContent.endsWith('▸') || bouton.textContent.endsWith('▾')) bouton.textContent = bouton.textContent.slice(0, -1) + (ouvert ? '▸' : '▾');
  if (ouvert) { boite.innerHTML = ''; return; }
  boite.innerHTML = chargeBox;
  try { const r = await charge(); if (bouton.getAttribute('aria-expanded') === 'true') boite.innerHTML = html(r); }
  catch (e) { boite.innerHTML = `<p class="na">Indisponible (${esc(e.message)}).</p>`; }
}

// Encart tout en bas : les jeux les plus connus du même auteur (voir CLAUDE.md).
function auteur(m) {
  const a = m && m.memeAuteur;
  if (!a || !a.jeux || !a.jeux.length) return '';
  return `<section class="aut"><h3>Du même auteur · ${esc(a.nom)}</h3><div class="autjeux">${a.jeux.map(ligneJeu).join('')}</div></section>`;
}

// Retour à la recherche précédente (celle d'où on a cliqué sur un 🔍) : réaffichée depuis la mémoire, sans rechargement.
const pile = [];
let courant = null;
function retour() {
  const p = pile[pile.length - 1];
  return p ? `<button type="button" class="back">← Retour à ${esc((p.myludo && p.myludo.titre) || p.query)}</button>` : '';
}

// Grand encart BoardGameGeek : note, infos pratiques, style de jeu (mécaniques et catégories BGG traduites en français).
function bggCard(d, games) {
  const b = d.bgg, pied = `<footer>${liens(d, games)}</footer>`;
  if (!b) return `<section class="ml bgg"><header><b>BoardGameGeek</b><span>indisponible</span></header>${pied}</section>`;
  // Pastille « Extensions ✓ » (seulement s'il y en a) : un clic déplie la liste avec leurs notes.
  const extB = b.extensions > 0 ? `<button type="button" class="bga oui ext" data-ext="${esc(b.id)}" aria-expanded="false" title="${b.extensions} extension(s) : voir leurs notes">Extensions ✓</button>` : '';
  const note = b.note == null ? `<span class="na">pas encore d'avis</span>${extB}` : `<span class="big">${fr(b.note)}<small>/10</small></span> <span class="mut">${b.votes} votes</span>${extB}`;
  const rang = b.rang ? `🏆 #${b.rang}${b.rangCat ? ` · #${b.rangCat.rang} ${esc(b.rangCat.nom)}` : ''}` : '';
  const joueurs = b.joueurs && `👥 ${esc(b.joueurs)}${b.ideal ? ` · idéal à ${esc(b.ideal)}` : ''}`;
  const facts = [rang, b.duree && `⏱ ${esc(b.duree)} min`, joueurs, b.poids != null && `⚖ ${fr(b.poids)}/5`].filter(Boolean).map(f => `<span>${f}</span>`).join('');
  const meca = b.mecaniques || [], th = b.themes || [];
  // Mécanique cliquable : déplie les 20 meilleurs jeux BGG de cette mécanique.
  const style = meca.length || th.length
    ? `<div class="chips">${meca.map(x => (typeof x === 'string' ? `<span class="chip">${esc(x)}</span>` : `<button type="button" class="chip" data-meca="${esc(x.id)}" data-nom="${esc(x.nom)}" title="Meilleurs jeux : ${esc(x.nom)}">${esc(x.nom)}</button>`)).join('')}${th.map(x => `<span class="chip th">${esc(x)}</span>`).join('')}</div><div class="box" id="mecabox"></div>`
    : '<div class="na">non renseigné</div>';
  return `<section class="ml bgg"><header><b>BoardGameGeek</b><span>${b.annee ? esc(b.annee) : ''}</span></header><div class="body"><div>${note}<div class="box" id="extbox"></div></div><div class="facts">${facts}</div><div><h3>Style de jeu</h3>${style}</div></div>${pied}</section>`;
}

// Board Game Arena : liste des jeux publics (lib/bga-games.json, régénérée par scripts/build-bga-list.mjs) chargée avec la page.
// Entrée : [slug, titre anglais, bggId (0 si inconnu), ...alias]. null tant qu'elle n'est pas lue (ou si elle est injoignable).
const BGA = fetch('lib/bga-games.json').then(r => (r.ok ? r.json() : null)).catch(() => null);
const COMBINING = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
const norm = s => String(s || '').normalize('NFD').replace(COMBINING, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
// Vrai si a et b sont égaux à une insertion, suppression ou substitution près.
function within1(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1);
  return a.length > b.length ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
}
// Correspondance exacte, sinon à une lettre près (« catane » → CATAN). Pas de correspondance « contient » (« Dune » ≠ « Dune: Imperium »).
// Alias de moins de 5 lettres (« TTR ») ignorés : trop ambigus.
function findBga(titres, games) {
  const keys = [...new Set((titres || []).map(norm).filter(Boolean))];
  if (!keys.length || !games) return null;
  const noms = g => [g[1], ...g.slice(3).filter(a => norm(a).length >= 5)].map(norm);
  const pick = test => {
    for (const k of keys) { const g = games.find(x => noms(x).some(n => test(n, k))); if (g) return g; }
    return null;
  };
  const g = pick((n, k) => n === k) || pick((n, k) => k.length >= 5 && within1(n, k));
  return g ? { nom: g[1], url: 'https://boardgamearena.com/gamepanel?game=' + g[0], bggId: g[2] || null } : null;
}

// Pastille Board Game Arena, à côté du nombre de joueurs : « BGA ✓ » cliquable (page du jeu sur BGA) suivie d'un « + »
// (ajout à la liste « À tester sur BGA »), ou « BGA ✓ » barré si le jeu n'y est pas. Rien tant que la liste BGA n'est pas lue.
function bgaBadge(d, games) {
  if (!games) return '';
  const bga = findBga([d.query, d.myludo && d.myludo.titre], games);
  if (!bga) return '<span class="bga non" title="Pas sur Board Game Arena">BGA <s>✓</s></span>';
  const dans = dansListe(LISTE_BGA, titreJeu(d));
  return `<a class="bga oui" href="${esc(bga.url)}" rel="noopener" title="Jouable sur Board Game Arena : ouvrir la page du jeu">BGA ✓</a>`
    + `<button type="button" class="bga plus${dans ? ' on' : ''}" data-liste="${esc(LISTE_BGA)}" title="Ma liste « ${esc(LISTE_BGA)} »">${dans ? '✓' : '+'}</button>`;
}

// Pied de l'encart BGG : page BoardGameGeek du jeu (lien direct si connu, repli par l'identifiant BGA, sinon recherche).
function liens(d, games) {
  const bga = findBga([d.query, d.myludo && d.myludo.titre], games);
  const bggUrl = (d.bgg && d.bgg.url) || d.bggUrl || (bga && bga.bggId ? 'https://boardgamegeek.com/boardgame/' + bga.bggId : null);
  return bggUrl ? ext(bggUrl, 'Ouvrir sur BoardGameGeek ↗') : ext(d.liens.bgg, 'Chercher sur BoardGameGeek ↗');
}

// Prix neuf de référence : le moins cher d'Esprit Jeu et Philibert (null si aucun).
function prixNeuf(d) {
  const p = [d && d.espritjeu && d.espritjeu.prix, d && d.philibert && d.philibert.prix].filter(x => x != null);
  return p.length ? Math.min(...p) : null;
}
// Écart occasion / neuf : « −45 % » (vert ≤ −30 %, orange ≤ −10 %, gris sinon).
function dealTag(prix, neuf) {
  if (neuf == null || prix == null) return '';
  const e = Math.round((prix / neuf - 1) * 100);
  const cls = e <= -30 ? 'top' : e <= -10 ? 'moy' : 'bof';
  return `<span class="deal ${cls}" title="vs ${fr(neuf)} € neuf">${e > 0 ? '+' : e < 0 ? '−' : ''}${Math.abs(e)} %</span>`;
}
function okk(o, lien, neuf = null) {
  if (!o) return `<section class="okk"><header><b>Okkazeo</b><div>indisponible</div></header><footer>${ext(lien, 'Chercher sur Okkazeo ↗')}</footer></section>`;
  const rows = o.annonces.map(a => `<div class="ann"><b>${fr(a.prix)} €${dealTag(a.prix, neuf)}</b><span>${esc(a.etat)}${a.bonneAffaire ? '<span class="tag ok">bonne affaire</span>' : ''}${a.extensions ? '<span class="tag">+ ext.</span>' : ''}<br><span class="mut">${esc(a.ville ?? '')}</span></span><span class="mut">${fmtDate(a.date)}</span></div>`).join('');
  const prix = (o.total && o.min != null ? ` · ${fr(o.min)}–${fr(o.max)} €` : '') + (neuf != null ? ` · neuf dès ${fr(neuf)} €` : '');
  const pied = o.annonces.length ? 'Ouvrir sur Okkazeo ↗' : o.total ? `Voir les ${o.total} annonces France ↗` : 'Ouvrir sur Okkazeo ↗';
  return `<section class="okk"><header><b>Okkazeo · ${o.annonces.length} près de Paris</b><div>${o.total} en France${prix}</div></header>${rows}<footer>${ext(o.url, pied)}</footer></section>`;
}

function render(d, games) {
  affiche = d;
  const m = d.myludo, L = d.liens;
  const head = m
    ? `<div class="head">${m.image ? `<img src="${esc(m.image)}" alt="">` : ''}<div><h1>${esc(m.titre)}</h1><div class="mut">${[m.annee, m.joueurs && m.joueurs + ' joueurs', m.age].filter(Boolean).map(esc).join(' · ')}${bgaBadge(d, games)}</div>${listesMenu(d)}</div></div>`
    : `<div class="head"><div><h1>${esc(d.query)}</h1><div class="mut">${bgaBadge(d, games)}</div>${listesMenu(d)}</div></div>`;
  // Tuile MyLudo minimaliste, comme les boutiques : note, nombre de notes, titre retenu (durée et poids sont dans l'encart BGG).
  const tiles = `<div class="tiles">${tile('Esprit Jeu', 'var(--ej)', d.espritjeu, 5, 'avis', L.espritjeu)}${tile('Philibert', 'var(--ph)', d.philibert, 5, 'avis', L.philibert)}${tile('MyLudo', 'var(--ml)', m && { note: m.note, avis: m.avis, titre: m.titre, url: m.url }, 10, 'notes', L.myludo || '#')}</div>`;
  $('#out').innerHTML = `${retour()}${ongletsHtml()}${head}${tiles}${bggCard(d, games)}${semblables(d)}${jumeauxBloc(d)}${auteur(m)}${okk(d.okkazeo, L.okkazeo, prixNeuf(d))}`;
  majVers();
}

// Comparateur : une colonne par jeu ouvert déjà chargé ; meilleure valeur en vert sur les lignes où « mieux » a un sens.
function comparerHtml(liste) {
  const ds = liste.filter(Boolean);
  if (ds.length < 2) return '<p class="na">Il faut au moins 2 jeux chargés pour comparer.</p>';
  const b = d => d.bgg || {};
  const occ = d => (d.okkazeo && d.okkazeo.min != null ? d.okkazeo.min : null);
  const ecart = d => { const n = prixNeuf(d), o = occ(d); return n != null && o != null ? Math.round((o / n - 1) * 100) : null; };
  const lignes = [
    ['Note BGG', d => b(d).note, 'max', v => fr(v) + '/10'],
    ['Note MyLudo', d => d.myludo && d.myludo.note, 'max', v => fr(v) + '/10'],
    ['Rang BGG', d => b(d).rang, 'min', v => '#' + v],
    ['Durée', d => b(d).duree, null, v => esc(v) + ' min'],
    ['Poids', d => b(d).poids, null, v => fr(v) + '/5'],
    ['Joueurs', d => b(d).joueurs, null, esc],
    ['Idéal à', d => b(d).ideal, null, esc],
    ['Prix neuf', prixNeuf, 'min', v => fr(v) + ' €'],
    ['Occasion (min)', occ, 'min', v => fr(v) + ' €'],
    ['Écart occasion', ecart, 'min', v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + ' %'],
  ];
  const tete = `<tr><th></th>${ds.map(d => `<th>${esc((d.myludo && d.myludo.titre) || b(d).titre || d.query)}</th>`).join('')}</tr>`;
  const corps = lignes.map(([nom, f, sens, fmt]) => {
    const vals = ds.map(d => { const v = f(d); return v == null || v === '' ? null : v; });
    const nums = vals.filter(v => typeof v === 'number');
    const best = sens && nums.length > 1 ? (sens === 'max' ? Math.max(...nums) : Math.min(...nums)) : null;
    return `<tr><th>${nom}</th>${vals.map(v => `<td${v != null && v === best ? ' class="best"' : ''}>${v == null ? '–' : fmt(v)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="compwrap"><table class="comp">${tete}${corps}</table></div>`;
}

// Petit bouton sous la recherche : bascule les jeux ouverts (onglets) dans le matchmaking Okkazeo.
function titresOuverts() {
  return onglets.map(q => { const d = enCache(q); return (d && d.myludo && d.myludo.titre) || q; });
}
function majVers() {
  const v = $('#vers');
  const n = listes.reduce((s, l) => s + l.jeux.length, 0);
  if (v) v.innerHTML = `<button type="button" class="petit" id="versListes">📋 Mes listes${n ? ` (${n})` : ''}</button>`
    + (onglets.length >= 2 ? `<button type="button" class="petit" id="versPanier">🛒 ${onglets.length} jeux → matchmaking</button>` : '');
}

// Mes listes : « À essayer », « À acheter », « À tester sur BGA » (fixes) + listes créées. Gardées dans le navigateur
// (localStorage, propres à cet appareil) ; stockage indisponible → listes gardées le temps de la page.
const LISTES_CLE = 'notesJeux.listes';
const LISTE_BGA = 'À tester sur BGA';
const LISTES_FIXES = ['À essayer', 'À acheter', LISTE_BGA];
function lireListes() {
  let l = [];
  try { l = JSON.parse(localStorage.getItem(LISTES_CLE)) || []; } catch (e) { l = []; }
  for (const nom of [...LISTES_FIXES].reverse()) if (!l.some(x => x.nom === nom)) l.unshift({ nom, jeux: [] });
  return l;
}
const listes = lireListes();
const sauverListes = () => { try { localStorage.setItem(LISTES_CLE, JSON.stringify(listes)); } catch (e) { /* voir lireListes */ } };
const titreJeu = d => (d.myludo && d.myludo.titre) || (d.bgg && d.bgg.titre) || d.query;
const memeJeu = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const dansListe = (nom, titre) => listes.some(l => l.nom === nom && l.jeux.some(j => memeJeu(j, titre)));
function basculer(nom, titre) {
  const l = listes.find(x => x.nom === nom);
  if (!l || !titre) return;
  const i = l.jeux.findIndex(j => memeJeu(j, titre));
  if (i >= 0) l.jeux.splice(i, 1); else l.jeux.push(titre);
  sauverListes();
}
function creerListe(nom) {
  nom = String(nom || '').trim().slice(0, 40);
  if (!nom || listes.some(x => memeJeu(x.nom, nom))) return null;
  listes.push({ nom, jeux: [] });
  sauverListes();
  return nom;
}
const champListe = '<div class="nvlw"><input class="nvl" maxlength="40" placeholder="Nouvelle liste" aria-label="Nom de la nouvelle liste"><button type="button" class="petit" data-nvl="1">Créer</button></div>';
// « ＋ Liste » sous le titre du jeu : une pastille par liste (verte si le jeu y est), clic = ajouter / retirer.
function listesMenu(d) {
  const t = titreJeu(d);
  return `<details class="addl"><summary>＋ Liste</summary><div class="chips">${listes.map(l => `<button type="button" class="chip${dansListe(l.nom, t) ? ' on' : ''}" data-liste="${esc(l.nom)}">${esc(l.nom)}</button>`).join('')}</div>${champListe}</details>`;
}
// Écran « Mes listes » : jeux cliquables (ouverts comme un 🔍), ✕ pour retirer, 🛒 vers le matchmaking, suppression des listes créées.
function listesHtml() {
  return `<h2 class="titre-l">📋 Mes listes</h2>${listes.map(l => `<section class="aut"><h3>${esc(l.nom)} · ${l.jeux.length}</h3>${l.jeux.length
    ? l.jeux.map(j => `<div class="sim"><button type="button" class="lien" data-q="${esc(j)}">${esc(j)}</button><button type="button" class="x" data-retire="${esc(l.nom)}" data-titre="${esc(j)}" aria-label="Retirer ${esc(j)}" title="Retirer">✕</button></div>`).join('')
    : '<p class="na">Vide.</p>'}<div class="actl">${l.jeux.length >= 2 ? `<button type="button" class="petit" data-panier="${esc(l.nom)}">🛒 ${l.jeux.length} jeux → matchmaking</button>` : ''}${LISTES_FIXES.includes(l.nom) ? '' : `<button type="button" class="petit" data-suppr="${esc(l.nom)}">Supprimer la liste</button>`}</div></section>`).join('')}<section class="aut"><h3>Nouvelle liste</h3>${champListe}</section>`;
}
function afficherListes() {
  if (affiche && courant) pile.push(courant); // « ← Retour à » ramène au jeu d'où l'on vient
  seq++;
  affiche = null;
  comparant = false;
  $('#out').innerHTML = `${retour()}${ongletsHtml()}${listesHtml()}`;
  majVers();
}
// Après un ajout / retrait : pastilles du jeu affiché mises à jour sur place (les encarts dépliés restent ouverts).
function majListeBoutons(nom) {
  const on = dansListe(nom, titreJeu(affiche));
  $('#out').querySelectorAll('[data-liste]').forEach(b => {
    if (b.dataset.liste !== nom) return;
    b.classList.toggle('on', on);
    if (b.classList.contains('plus')) b.textContent = on ? '✓' : '+';
  });
}
function versPanier(jeux) {
  $('#pj').value = jeux.join('\n');
  $('.panier').scrollIntoView({ behavior: 'smooth' });
  $('#pj').focus();
}

function skeleton() {
  const t = n => `<div class="tile"><div class="src">${n}</div><div class="skel" style="width:50%;height:22px"></div><div class="skel" style="width:70%"></div></div>`;
  const bloc = (cls, nom) => `<section class="${cls}"><header><b>${nom}</b></header><div style="padding:12px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section>`;
  return `<div class="tiles">${t('Esprit Jeu')}${t('Philibert')}${t('MyLudo')}</div>${bloc('ml bgg', 'BoardGameGeek')}${bloc('okk', 'Okkazeo')}`;
}

// Résultats déjà chargés, réaffichés sans rechargement pendant 15 min (clé : la recherche en minuscules).
const CACHE = new Map();
const CACHE_MS = 15 * 60 * 1000;
const ENCOURS = new Map(); // chargements en cours : un même jeu n'est demandé qu'une fois
const ECHECS = new Set();
const cleDe = q => q.trim().toLowerCase();
const enCache = q => { const c = CACHE.get(cleDe(q)); return c && Date.now() - c.t < CACHE_MS ? c.d : null; };

function charger(q) {
  const cle = cleDe(q);
  const d = enCache(q);
  if (d) return Promise.resolve(d);
  if (ENCOURS.has(cle)) return ENCOURS.get(cle);
  ECHECS.delete(cle);
  const p = fetch(API + '?q=' + encodeURIComponent(q))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { CACHE.set(cle, { d, t: Date.now() }); return d; })
    .catch(err => { ECHECS.add(cle); throw err; })
    .finally(() => ENCOURS.delete(cle));
  ENCOURS.set(cle, p);
  return p;
}

// Recherche de plusieurs jeux (séparés par des virgules) : un onglet par jeu, tous chargés en parallèle,
// navigation libre d'un onglet à l'autre sans rechargement.
// Un 🔍 (semblables, même auteur, jumeaux, top d'une mécanique) ouvre le jeu ET l'ajoute en onglet ; ✕ ferme un onglet.
const MAX_ONGLETS = 20;
let onglets = [];
let actif = -1;
let comparant = false; // onglet « ⚖ Comparer » affiché
let affiche = null; // résultat affiché (null pendant un chargement)
function ongletsHtml() {
  if (onglets.length < 2) return '';
  const charges = onglets.filter(q => enCache(q)).length;
  return `<nav class="onglets">${onglets.map((q, i) => {
    const d = enCache(q);
    const nom = (d && d.myludo && d.myludo.titre) || q;
    const etat = d ? '' : ECHECS.has(cleDe(q)) ? ' ⚠' : ' …';
    return `<span class="onglet-g${i === actif && !comparant ? ' on' : ''}"><button type="button" class="onglet${d ? '' : ' att'}" data-i="${i}">${esc(nom)}${etat}</button><button type="button" class="x" data-x="${i}" aria-label="Fermer ${esc(nom)}" title="Fermer">✕</button></span>`;
  }).join('')}${charges >= 2 ? `<button type="button" class="onglet${comparant ? ' on' : ''}" data-comp="1">⚖ Comparer</button>` : ''}</nav>`;
}
function afficherComparaison() {
  comparant = true;
  affiche = null;
  $('#out').innerHTML = `${ongletsHtml()}${comparerHtml(onglets.map(enCache))}`;
  majVers();
}
async function fermer(i) {
  const etaitActif = i === actif;
  onglets.splice(i, 1);
  if (i < actif) actif--;
  if (comparant) {
    if (onglets.filter(q => enCache(q)).length >= 2) return afficherComparaison();
    comparant = false;
    actif = Math.min(Math.max(actif, 0), onglets.length - 1);
    return search(onglets[actif]);
  }
  if (etaitActif) { actif = Math.min(i, onglets.length - 1); if (actif >= 0) return search(onglets[actif]); }
  if (affiche) render(affiche, await BGA); else majVers();
}
// Un onglet vient de finir de charger : on met à jour les étiquettes de la barre sans changer ce qui est affiché.
async function majOnglets() {
  const games = await BGA;
  if (comparant) afficherComparaison();
  else if (affiche) render(affiche, games);
}

async function search(q) {
  const my = ++seq;
  if (!enCache(q)) { affiche = null; $('#out').innerHTML = ongletsHtml() + skeleton(); }
  try {
    const d = await charger(q);
    const games = await BGA;
    if (my === seq) { courant = d; render(d, games); }
  } catch (err) {
    if (my === seq) { affiche = null; $('#out').innerHTML = `${retour()}${ongletsHtml()}<p class="na">Recherche impossible (${esc(err.message)}). Réessaie dans un instant.</p>`; }
  }
}

// garder : recherche lancée depuis un 🔍 → on mémorise l'écran actuel pour pouvoir y revenir, et le jeu est ajouté
// aux onglets (le jeu d'où l'on vient en devient un s'il n'y en avait pas) ;
// sinon nouvelle recherche, pile vidée, et une liste « A, B, C » ouvre un onglet par jeu (20 au plus).
function lancer(q, garder) {
  if (!q) return;
  comparant = false;
  if (garder && courant && pile[pile.length - 1] !== courant) pile.push(courant); else if (!garder) pile.length = 0;
  if (garder) {
    if (!onglets.length && courant) onglets = [courant.query];
    let i = onglets.findIndex(x => cleDe(x) === cleDe(q));
    if (i < 0 && onglets.length < MAX_ONGLETS) i = onglets.push(q) - 1;
    actif = i;
  } else {
    const vus = new Set();
    onglets = q.split(/[,;]/).map(x => x.trim()).filter(x => x && !vus.has(cleDe(x)) && vus.add(cleDe(x))).slice(0, MAX_ONGLETS);
    if (onglets.length < 2) onglets = [];
    actif = onglets.length ? 0 : -1;
  }
  majVers();
  if (!garder) $('#q').value = q;
  history.replaceState(null, '', '?q=' + encodeURIComponent(garder ? q : $('#q').value));
  if (onglets.length && !garder) {
    // 6 chargements à la fois (20 jeux d'un coup = ~300 requêtes vers MyLudo et les boutiques).
    const file = onglets.slice();
    const suivant = () => { const x = file.shift(); if (x) charger(x).then(majOnglets, majOnglets).then(suivant); };
    for (let k = 0; k < 6; k++) suivant();
    search(onglets[0]);
  } else search(q);
}

$('#f').addEventListener('submit', e => {
  e.preventDefault();
  lancer($('#q').value.trim());
});

// Raccourci 🔍 à côté d'un jeu semblable : lance la recherche de ce jeu sans retaper son nom.
$('#out').addEventListener('click', e => {
  const t = s => e.target.closest && e.target.closest(s);
  const b = t('.go') || t('[data-q]');
  if (b) { lancer(b.dataset.q, true); scrollTo(0, 0); return; }
  const li = t('[data-liste]');
  if (li && affiche) { basculer(li.dataset.liste, titreJeu(affiche)); majListeBoutons(li.dataset.liste); majVers(); return; }
  const nv = t('[data-nvl]');
  if (nv) {
    const nom = creerListe(nv.closest('.nvlw').querySelector('input').value);
    if (!nom) return;
    if (!affiche) { afficherListes(); return; }
    basculer(nom, titreJeu(affiche)); // créée depuis un jeu : il y est ajouté
    BGA.then(games => { render(affiche, games); const m = $('.addl'); if (m) m.open = true; });
    return;
  }
  const re = t('[data-retire]');
  if (re) { basculer(re.dataset.retire, re.dataset.titre); afficherListes(); return; }
  const su = t('[data-suppr]');
  if (su) {
    const i = listes.findIndex(l => l.nom === su.dataset.suppr);
    if (i >= 0 && confirm(`Supprimer la liste « ${listes[i].nom} » ?`)) { listes.splice(i, 1); sauverListes(); afficherListes(); }
    return;
  }
  const pa = t('[data-panier]');
  if (pa) { versPanier((listes.find(l => l.nom === pa.dataset.panier) || { jeux: [] }).jeux); return; }
  const x = t('[data-x]');
  if (x) { fermer(Number(x.dataset.x)); return; }
  if (t('[data-comp]')) { afficherComparaison(); return; }
  const o = t('.onglet');
  if (o) { actif = Number(o.dataset.i); comparant = false; pile.length = 0; search(onglets[actif]); return; }
  if (t('.back')) { revenir(); return; }
  const ex = t('[data-ext]');
  if (ex) { deplier(ex, $('#extbox'), () => outil({ op: 'ext', id: ex.dataset.ext }).then(r => r.extensions), extensionsHtml); return; }
  const j = t('[data-jum]');
  if (j) { deplier(j, $('#jumbox'), () => outil({ op: 'jumeaux', id: j.dataset.jum }).then(r => r.jumeaux), jumeauxHtml); return; }
  const m = t('[data-meca]');
  if (m) {
    // Une seule mécanique dépliée à la fois ; re-cliquer la même referme.
    const box = $('#mecabox');
    const ouvert = m.classList.contains('on');
    $('#out').querySelectorAll('[data-meca].on').forEach(c => c.classList.remove('on'));
    if (ouvert) { box.innerHTML = ''; return; }
    m.classList.add('on');
    box.innerHTML = chargeBox;
    outil({ op: 'meca', id: m.dataset.meca })
      .then(r => { if (m.classList.contains('on')) box.innerHTML = listeBox(`Top ${r.jeux.length} BGG · ${esc(m.dataset.nom)}`, r.jeux, 'Aucun jeu classé.'); })
      .catch(err => { if (m.classList.contains('on')) box.innerHTML = `<p class="na">Indisponible (${esc(err.message)}).</p>`; });
  }
});

// 🛒 : les jeux ouverts partent dans la case du matchmaking (titres MyLudo : Okkazeo ne cherche que le titre exact).
// 📋 : écran « Mes listes ».
$('#vers').addEventListener('click', e => {
  const t = s => e.target.closest && e.target.closest(s);
  if (t('#versPanier')) versPanier(titresOuverts());
  else if (t('#versListes')) { afficherListes(); scrollTo(0, 0); }
});

// Liste collée (un jeu par ligne, ou cellules d'un tableur) : chaque retour à la ligne / tabulation devient une virgule,
// puces et numéros retirés. Les espaces restent dans les titres (« 7 Wonders Duel »).
const listeCollee = t => t.split(/[\r\n\t]+/).map(x => x.replace(/^\s*(?:[-•*]|\d+[.)])\s+/, '').trim()).filter(Boolean).join(', ');
$('#q').addEventListener('paste', e => {
  const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
  if (!/[\r\n\t]/.test(t.trim())) return;
  e.preventDefault();
  const q = $('#q'), a = q.selectionStart ?? q.value.length, b = q.selectionEnd ?? a;
  const avant = q.value.slice(0, a).trim();
  q.value = (avant ? avant + ', ' : '') + listeCollee(t) + q.value.slice(b);
});

// Saisie semi-automatique (titres MyLudo), à partir de 3 lettres, pas pendant une liste « A, B ».
let suggT = null;
$('#q').addEventListener('input', () => {
  clearTimeout(suggT);
  const v = $('#q').value.trim();
  if (v.length < 3 || /[,;]/.test(v)) return;
  suggT = setTimeout(() => outil({ op: 'suggest', q: v })
    .then(r => { $('#sugg').innerHTML = r.titres.map(x => `<option value="${esc(x)}">`).join(''); })
    .catch(() => {}), 300);
});

// 📷 : photo du code-barres → EAN (BarcodeDetector si le navigateur l'a, sinon ZXing chargé à la demande) → titre → recherche.
$('#camb').addEventListener('click', () => $('#cam').click());
async function lireCode(fichier) {
  if ('BarcodeDetector' in window) {
    const r = await new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }).detect(await createImageBitmap(fichier));
    if (r[0]) return r[0].rawValue;
  }
  if (!window.ZXing) await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = ok; s.onerror = () => ko(new Error('lecteur indisponible')); document.head.appendChild(s); });
  const url = URL.createObjectURL(fichier);
  try { return (await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url)).getText(); } finally { URL.revokeObjectURL(url); }
}
$('#cam').addEventListener('change', async () => {
  const f = $('#cam').files[0];
  $('#cam').value = '';
  if (!f) return;
  $('#out').innerHTML = '<p class="mut">Lecture du code-barres…</p>';
  try {
    const code = await lireCode(f).catch(() => null);
    if (!code) throw new Error('code-barres illisible, reprends la photo plus près et bien nette');
    const r = await outil({ op: 'ean', code });
    if (!r.titre) throw new Error(`aucun jeu trouvé pour le code ${code}`);
    lancer(r.titre);
  } catch (err) {
    $('#out').innerHTML = `<p class="na">${esc(err.message)}</p>`;
  }
});

async function revenir() {
  const prev = pile.pop();
  if (!prev) return;
  seq++; // annule une recherche encore en cours
  comparant = false;
  courant = prev;
  actif = onglets.findIndex(x => cleDe(x) === cleDe(prev.query));
  if (!onglets.length) { $('#q').value = prev.query; history.replaceState(null, '', '?q=' + encodeURIComponent(prev.query)); }
  render(prev, await BGA);
  scrollTo(0, 0);
}

// Matchmaking Okkazeo (workflow « Notes Jeux — Panier ») : vendeurs qui proposent au moins 2 des jeux de la liste.
const API_PANIER = 'https://n8n.srv1250642.hstgr.cloud/webhook/notes-jeux-panier';
function panierHtml(p) {
  const jeux = (p.jeux || []).map(j => (j.titre
    ? `<span class="chip">${ext(j.url, esc(j.titre))} · ${j.annonces} annonce${j.annonces > 1 ? 's' : ''}</span>`
    : `<span class="chip th">${esc(j.demande)} : introuvable sur Okkazeo</span>`)).join('');
  const vendeurs = (p.vendeurs || []).length
    ? p.vendeurs.map(v => `<div class="vend"><div class="top"><b>${esc(v.vendeur)}</b><span class="mut">${esc(v.ville ?? '')}${v.cp ? ` (${esc(v.cp)})` : ''}</span>${v.procheParis ? '<span class="tag ok">près de Paris</span>' : ''}${v.envoi ? '<span class="tag">envoi</span>' : ''}<span class="right"><b>${v.nbJeux} jeux</b> · ${fr(v.total)} €</span></div>${v.annonces.map(a => `<div class="ann2"><span>${esc(a.jeu)} <span class="mut">${esc(a.etat ?? '')}</span></span><span>${fr(a.prix)} € ${a.url ? ext(a.url, 'annonce ↗') : ''}</span></div>`).join('')}</div>`).join('')
    : '<p class="na">Aucun vendeur ne propose au moins 2 de ces jeux.</p>';
  const err = (p.erreurs || []).length ? `<p class="mut">Problème : ${esc(p.erreurs.join(' · '))}</p>` : '';
  return `<div class="chips">${jeux}</div>${vendeurs}${err}`;
}

$('#pf').addEventListener('submit', async e => {
  e.preventDefault();
  const jeux = $('#pj').value.split(/[\n,;|]+/).map(x => x.trim()).filter(Boolean);
  if (jeux.length < 2) { $('#pr').innerHTML = '<p class="na">Mets au moins 2 jeux (un par ligne).</p>'; return; }
  $('#pr').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    const r = await fetch(API_PANIER + '?jeux=' + encodeURIComponent(jeux.join('|')));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    $('#pr').innerHTML = panierHtml(await r.json());
  } catch (err) {
    $('#pr').innerHTML = `<p class="na">Recherche impossible (${esc(err.message)}). Réessaie dans un instant.</p>`;
  }
});

majVers();

if (initial) lancer(initial.trim());
